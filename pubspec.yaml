name: dapoy_wallet
description: "Personal & Family Budget App - Flutter, Responsive Multi-Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  fl_chart: ^0.70.2
  shared_preferences: ^2.3.4
  excel: ^4.0.6
  supabase_flutter: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/2026 Budget.xlsx
    - assets/budget_data.json
